# Robolectric 全局配置
# 统一使用 SDK 34，避免为每个 @Config(sdk=...) 额外下载 android-all jar。
sdk=34

# 使用本地离线 Maven 仓库，沙箱内无法直连 repo1.maven.org。
# 仓库内容：org/robolectric/android-all-instrumented/14-robolectric-10818077-i7/
robolectric.dependency.repo.url=file:///opt/robolectric-maven
robolectric.dependency.repo.id=local-offline

# 复用已下载的 jar，不再触发网络请求
robolectric.offline=true
